# =============================================================
# Fluentd の設定（ログの集中管理）
#   各コンテナ → (Docker の fluentd ロギングドライバ) → ここ → ファイルに保存
#   1. <source> : ログを受け取る入口
#   2. <filter> : 受け取ったログを加工する（JSON を分解する など）
#   3. <match>  : 加工したログの出力先を決める
# =============================================================

# ---- 1. 入口：Docker から送られてくるログを 24224 番ポートで受け取る ----
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# ---- 2. 加工 ----
# Docker から届くレコードは {"log": "1行分の文字列", "container_name": ..., "source": "stderr"} の形。
# Laravel は JSON で出力しているので、"log" の中身を分解して
# message / level_name / context などを1つずつのフィールドにする。
# JSON ではない行（php-fpm 自身のメッセージなど）は、そのまま残す。
<filter docker.app>
  @type parser
  key_name log
  reserve_data true             # container_name などの元のフィールドも残す
  remove_key_name_field true    # 分解できたら、元の "log" は消す
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# Nginx のアクセスログ（標準の形式）を、remote / method / path / code などに分解する
<filter docker.nginx>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type nginx
  </parse>
</filter>

# ---- 3. 出力：サービスごと・日付ごとのファイルに保存し、Fluentd の画面にも出す ----
<match docker.**>
  @type copy
  <store>
    @type file
    # 例：/fluentd/log/docker.app/20261119.log
    path /fluentd/log/${tag}/%Y%m%d
    append true
    <format>
      @type json
    </format>
    <buffer tag,time>
      timekey 1d             # 1日ごとにファイルを分ける
      timekey_wait 1m
      flush_mode interval
      flush_interval 5s      # 5秒ごとにファイルへ書き出す
    </buffer>
  </store>
  <store>
    @type stdout             # docker compose logs fluentd でも確認できるようにする
  </store>
</match>
