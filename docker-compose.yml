services:
  # Nginx（Webサーバー）
  nginx:
    image: nginx:latest
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html   # ホストPCの src/（Laravelプロジェクト）をコンテナ内に同期させる
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network
    # アクセスログ・エラーログを Fluentd に送る（設定の意味は app と同じ）
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "docker.nginx"
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # 受け取ったメールを確認する画面
    networks:
      - app-network
    # メールを受け取るポート（1025番）は、同じネットワークの app コンテナから使うだけなので ports に書かなくてよい

  # PHP-FPM（アプリケーション）
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html   # LaravelのDB接続設定は src/.env に書く（ここには書かない）
    # Laravel のログを、ファイル（storage/logs）に加えて標準エラー（stderr）にも JSON で出す。
    # compose の environment は src/.env より優先される
    environment:
      LOG_CHANNEL: stack
      LOG_STACK: "single,stderr"
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
    depends_on:
      - db
      - fluentd
      - redis
    networks:
      - app-network
    labels:
      app: "laravel"
      env: "local"
    # コンテナのログ（stdout/stderr）を Fluentd に送る
    logging:
      driver: "fluentd"
      options:
        # ログを送るのはコンテナではなく Docker 本体なので、ホストに公開したポートを指定する
        fluentd-address: "localhost:24224"
        # Fluentd が起動していなくても、コンテナの起動を止めない
        fluentd-async: "true"
        tag: "docker.app"
        labels: "app,env"   # 上の labels の値をログに付ける
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # MySQL（データベース）
  db:
    image: mysql:8.0
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql   # MySQLのデータを「db-data」というボリュームに永続化
    networks:
      - app-network

  # phpMyAdmin（データベース管理ツール）
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - app-network
  # Fluentd（ログ収集）：各コンテナのログを受け取り、まとめて保存する
  fluentd:
    image: fluent/fluentd:v1.19-1
    ports:
      - "127.0.0.1:24224:24224"   # Docker 本体がここにログを送る。外部には公開しない
    volumes:
      - ./fluentd/conf:/fluentd/etc   # 設定ファイル（fluent.conf）
      - fluentd-log:/fluentd/log      # 集めたログの保存先
    networks:
      - app-network

  # Redis（キャッシュ）：よく見られる一覧データを一時保存して、DBへの問い合わせを減らす
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # 手元から redis-cli で確認する用。外部には公開しない
    networks:
      - app-network   # app と同じネットワークに入れる（REDIS_HOST=redis で接続できるようにする）

# 永続化ボリューム（コンテナを削除してもDBのデータを残す）
volumes:
  db-data:
  fluentd-log:   # 集めたログ（コンテナを削除しても残す）

# 仮想ネットワーク（同じネットワーク内のコンテナはサービス名で通信できる）
networks:
  app-network:
    driver: bridge
