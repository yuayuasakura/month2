name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ステップ1: コード品質チェック
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install
      - run: vendor/bin/php-cs-fixer fix --dry-run
      - run: vendor/bin/phpstan analyse --memory-limit=1G
  
  # ステップ2: テスト
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, mysql
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install
      - run: npm ci && npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate

      - name: テストを実行してカバレッジを計測
        run: vendor/bin/phpunit --coverage-text=coverage.txt --coverage-html=coverage-html --coverage-clover=coverage.xml

      - name: カバレッジをActionsの画面に表示
        if: always()
        run: |
          echo '## テストカバレッジ' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: HTMLのカバレッジレポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: src/coverage-html
  
  
  # ステップ3: イメージをビルドしてDocker Hubにpush（テストが成功し、mainブランチのときだけ）
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Docker Hubにログイン
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: イメージのタグ・ラベルを生成
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/myapp
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: ビルドしてDocker Hubにpush
        uses: docker/build-push-action@v5
        with:
          context: .   # リポジトリ直下（Dockerfile の COPY で src/ を指定している）
          target: app  # 指定しないと最後のステージ（web = Nginx）がビルドされてしまう
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Nginx用イメージのタグを生成（appと同じルール）
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/myapp-web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Nginx用イメージ（public/ 入り）をビルドしてpush
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}

  # ステップ4: デプロイ（mainブランチへのpushのみ）
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      APP_IMAGE: yuasan/yuasan-my-app
      WEB_IMAGE: yuasan/yuasan-my-app
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Actions の IP に 22番を許可する
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.SG_ID }} --protocol tcp --port 22 --cidr $IP/32

      - name: タグ用の短いコミットSHAを用意
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 許可を消す
        if: always()
        run: aws ec2 revoke-security-group-ingress --group-id ${{ secrets.SG_ID }} --protocol tcp --port 22 --cidr ${{ env.RUNNER_IP }}/32

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hubにログイン
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: appイメージをビルドしてpush
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.APP_IMAGE }}:latest

      - name: webイメージをビルドしてpush
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: GitHub ActionsのIPアドレスを取得
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: AWSの認証情報を設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: セキュリティグループにSSHの一時的な許可を追加
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: EC2でpullして起動
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/month2
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize
            docker image prune -f

      - name: セキュリティグループから一時的な許可を削除
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32