name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ステップ1: コード品質チェック
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install
      - run: vendor/bin/php-cs-fixer fix --dry-run
      - run: vendor/bin/phpstan analyse --memory-limit=1G
  
  # ステップ2: テスト
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src
    
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, mysql
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install
      - run: npm ci && npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate

      - name: テストを実行してカバレッジを計測
        run: vendor/bin/phpunit --coverage-text=coverage.txt --coverage-html=coverage-html --coverage-clover=coverage.xml

      - name: カバレッジをActionsの画面に表示
        if: always()
        run: |
          echo '## テストカバレッジ' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: HTMLのカバレッジレポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: src/coverage-html
  
  # ステップ3: デプロイ（mainブランチのみ）
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/your-laravel-app
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-dev
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker run --rm -v "$(pwd)/src:/app" -w /app node:22 sh -c "npm ci && npm run build"
            docker compose -f docker-compose.prod.yml exec -T app php artisan cache:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache